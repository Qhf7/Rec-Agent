<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Rec-Agent Brand Logo (1080x1080)</title>
  <desc id="logoDesc">Rec-Agent 专属矢量品牌图标：融合智能商品卡片、AI 生成星芒与神经知识图谱路由节点。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="squircle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0ea5e9" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" rx="80" fill="url(#bg)"/>
  <rect x="60" y="60" width="960" height="960" rx="56" fill="#ffffff"/>

  <!-- Central Squircle Icon -->
  <g transform="translate(310, 170)" filter="url(#glow)">
    <rect x="0" y="0" width="460" height="460" rx="115" fill="url(#squircle)"/>
    <!-- Recommendation Product Card -->
    <rect x="82" y="108" width="296" height="236" rx="42" fill="#ffffff" fill-opacity="0.96"/>
    <!-- Product Thumbnail & Lines -->
    <rect x="118" y="144" width="96" height="72" rx="18" fill="#2563eb"/>
    <rect x="118" y="236" width="96" height="22" rx="11" fill="#0ea5e9"/>
    <rect x="186" y="302" width="88" height="18" rx="9" fill="#94a3b8"/>
    <!-- AI Sparkle Star -->
    <path d="M318 62 L336 120 L394 138 L336 156 L318 214 L300 156 L242 138 L300 120 Z" fill="url(#sparkle)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <!-- Evidence Graph Nodes -->
    <line x1="152" y1="326" x2="230" y2="248" stroke="#1d4ed8" stroke-width="18" stroke-linecap="round"/>
    <line x1="308" y1="326" x2="230" y2="248" stroke="#1d4ed8" stroke-width="18" stroke-linecap="round"/>
    <circle cx="230" cy="248" r="28" fill="#1d4ed8"/>
    <circle cx="152" cy="326" r="28" fill="#2563eb" stroke="#ffffff" stroke-width="10"/>
    <circle cx="308" cy="326" r="28" fill="#06b6d4" stroke="#ffffff" stroke-width="10"/>
  </g>

  <!-- Typography -->
  <text x="540" y="768" text-anchor="middle" font-family="'PingFang SC', 'SF Pro Display', -apple-system, sans-serif" font-size="96" font-weight="800" fill="#0f172a" letter-spacing="-1.5">Rec-Agent</text>
  <text x="540" y="836" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="28" font-weight="600" fill="#64748b" letter-spacing="6">AIGR RECOMMENDATION ENGINE</text>
</svg>
