<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Rec-Agent 与 Jev 曝光审核流程</title>
  <desc id="desc">四列主链路展示用户与数据进入 Rec-Agent，形成推荐候选和事实包，再交给 Jev 审核，最后分流为四种曝光处置。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
    <linearGradient id="agentIcon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="jevIcon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#64748b" flood-opacity=".16"/></filter>
    <marker id="arrowMain" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#2563eb"/></marker>
    <marker id="arrowJev" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#7c3aed"/></marker>
    <marker id="arrowExpose" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#059669"/></marker>
    <marker id="arrowRewrite" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#d97706"/></marker>
    <marker id="arrowHuman" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#ea580c"/></marker>
    <marker id="arrowBlock" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#be123c"/></marker>
    <style>
      .title{font:700 38px "Avenir Next","Aptos Display","PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033;letter-spacing:-.4px}
      .subtitle{font:400 18px "Avenir Next","Aptos Display","PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b;letter-spacing:.2px}
      .stage{font:700 13px "Avenir Next","Aptos Display","PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.4px;fill:#64748b}
      .cardTitle{font:700 24px "Avenir Next","Aptos Display","PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033;letter-spacing:-.2px}
      .cardSub{font:500 16px "Avenir Next","Aptos Display","PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b;font-style:italic;letter-spacing:.25px}
      .body{font:400 16px "Avenir Next","Aptos Display","PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .small{font:400 15px "Avenir Next","Aptos Display","PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b;font-style:italic;letter-spacing:.15px}
      .mono{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#475569}
      .node{fill:url(#paper);stroke:#cbd5e1;stroke-width:1.5}
      .label{font:600 14px "Avenir Next","Aptos Display","PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2563eb;font-style:italic}
      .outTitle{font:700 20px "Avenir Next","Aptos Display","PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .outSub{font:400 16px "Avenir Next","Aptos Display","PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569;font-style:italic;letter-spacing:.15px}
    </style>
  </defs>

  <rect width="1800" height="1050" fill="#f8fafc"/>
  <rect x="32" y="32" width="1736" height="986" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="84" y="92" class="title">Rec-Agent × Jev · 生成式推荐与曝光审核链路</text>
  <text x="84" y="123" class="subtitle">从用户上下文生成商品卡片，再通过 Jev 进行曝光前判定与处置分流</text>
  <rect x="1422" y="72" width="284" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="1448" cy="91" r="6" fill="#2563eb"/><text x="1464" y="96" class="small">rec-agent-v2 · jev-1.14.0</text>

  <rect x="84" y="190" width="360" height="420" rx="18" class="node" filter="url(#shadow)"/>
  <text x="112" y="226" class="stage">01  INPUT CONTEXT</text>
  <text x="112" y="265" class="cardTitle">用户与数据输入</text>
  <text x="112" y="292" class="cardSub">user_id → profile / behavior / session</text>
  <circle cx="264" cy="370" r="56" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="264" cy="350" r="16" fill="#2563eb"/>
  <path d="M231 404c9-27 57-27 66 0" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  <text x="264" y="458" text-anchor="middle" class="mono">demo-user</text>
  <line x1="112" y1="490" x2="416" y2="490" stroke="#e2e8f0"/>
  <circle cx="124" cy="516" r="9" fill="#dbeafe" stroke="#60a5fa"/>
  <path d="M120 516l3 3 6-7" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="144" y="522" class="body">画像、行为、购物车、搜索词</text>
  <circle cx="124" cy="548" r="9" fill="#ede9fe" stroke="#a78bfa"/>
  <path d="M119 548h10m-5-5v10" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <text x="144" y="554" class="body">城市气候、活跃时段、促销规则</text>
  <rect x="112" y="570" width="20" height="16" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <path d="M116 574h12m-12 4h12m-12 4h8" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="144" y="583" class="mono">MCP read-only · data/raw/</text>

  <rect x="500" y="190" width="360" height="420" rx="18" class="node" filter="url(#shadow)"/>
  <text x="528" y="226" class="stage">02  GENERATE</text>
  <text x="528" y="265" class="cardTitle">Rec-Agent</text>
  <text x="528" y="292" class="cardSub">选品 + 用户可见推荐理由</text>
  <rect x="626" y="330" width="108" height="108" rx="30" fill="url(#agentIcon)" filter="url(#shadow)"/>
  <rect x="651" y="357" width="58" height="45" rx="15" fill="#08203d"/>
  <circle cx="667" cy="379" r="5.5" fill="#67e8f9"/><circle cx="680" cy="379" r="5.5" fill="#67e8f9"/><circle cx="693" cy="379" r="5.5" fill="#67e8f9"/>
  <path d="M671 392c7 7 15 7 22 0" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  <path d="M672 350v-11m22 11v-11" stroke="#d9faff" stroke-width="3" stroke-linecap="round"/>
  <text x="680" y="468" text-anchor="middle" class="body">1–3 张推荐卡片</text>
  <text x="528" y="514" class="mono">user_profile</text>
  <text x="528" y="542" class="mono">exposure_reason</text>
  <text x="528" y="570" class="mono">evidence_fields</text>

  <rect x="916" y="190" width="360" height="420" rx="18" class="node" filter="url(#shadow)"/>
  <text x="944" y="226" class="stage">03  TRACE</text>
  <text x="944" y="265" class="cardTitle">候选与事实包</text>
  <text x="944" y="292" class="cardSub">将推荐依据变成可核验事实</text>
  <rect x="952" y="335" width="288" height="94" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="974" y="357" width="24" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <path d="M980 365h12m-12 6h12m-12 6h8" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1012" y="365" class="mono">recommendations[]</text>
  <text x="1012" y="391" class="small">商品 ID · 标题 · 曝光理由</text>
  <text x="1012" y="416" class="small">证据字段 · 用户画像</text>
  <rect x="952" y="455" width="288" height="94" rx="13" fill="#faf5ff" stroke="#c4b5fd"/>
  <path d="M974 478l14-7 14 7v16l-14 7-14-7Z" fill="#ede9fe" stroke="#a78bfa"/>
  <path d="M981 485l5 5 9-10" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1012" y="485" class="mono">fact_bundle-v1</text>
  <text x="1012" y="509" class="small">provenance · coverage</text>
  <text x="1012" y="534" class="small">rule_features · 可追溯</text>
  <text x="944" y="583" class="body">可追溯、可复核、交给 Jev</text>

  <rect x="1332" y="190" width="360" height="420" rx="18" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="1360" y="226" class="stage">04  JUDGE</text>
  <text x="1360" y="265" class="cardTitle">Jev 曝光审核</text>
  <text x="1360" y="292" class="cardSub">事实核验 · 风险判定 · 安全门禁</text>
  <path d="M1512 328l62 22v45c0 43-27 72-62 91-35-19-62-48-62-91v-45l62-22Z" fill="url(#jevIcon)" filter="url(#shadow)"/>
  <path d="M1512 356v65m-29-40 29 22 29-22m-43 42 14-10 14 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1483" cy="381" r="5.5" fill="#fff"/><circle cx="1541" cy="381" r="5.5" fill="#fff"/><circle cx="1512" cy="421" r="5.5" fill="#fff"/>
  <text x="1512" y="500" text-anchor="middle" class="body">jev-1.14.0</text>
  <text x="1360" y="538" class="mono">decision · risk_type · evidence</text>
  <text x="1360" y="566" class="mono">judge_score · escalated</text>
  <text x="1360" y="594" class="mono">model_version</text>

  <path d="M444 400H500" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowMain)"/>
  <rect x="445" y="363" width="54" height="22" rx="11" fill="#eff6ff"/>
  <text x="472" y="379" text-anchor="middle" class="label">上下文</text>
  <path d="M860 400H916" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowMain)"/>
  <rect x="860" y="363" width="56" height="22" rx="11" fill="#eff6ff"/>
  <text x="888" y="379" text-anchor="middle" class="label">候选</text>
  <path d="M1276 400H1332" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowJev)"/>
  <rect x="1274" y="363" width="60" height="22" rx="11" fill="#faf5ff"/>
  <text x="1304" y="379" text-anchor="middle" style="font:600 14px 'Avenir Next','Aptos Display','PingFang SC','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7c3aed;font-style:italic">事实包</text>

  <text x="84" y="690" class="stage">05  EXPOSURE DECISION · 四档处置</text>
  <path d="M1512 610V658H900V710" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowJev)"/>
  <circle cx="900" cy="710" r="6" fill="#7c3aed"/>
  <rect x="1230" y="640" width="96" height="24" rx="12" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="1278" y="657" text-anchor="middle" style="font:600 14px 'Avenir Next','Aptos Display','PingFang SC','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7c3aed;font-style:italic">判决分流</text>
  <path d="M264 710H1512" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M264 710V752" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowExpose)"/>
  <path d="M678 710V752" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrowRewrite)"/>
  <path d="M1092 710V752" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowHuman)"/>
  <path d="M1512 710V752" fill="none" stroke="#be123c" stroke-width="3" marker-end="url(#arrowBlock)"/>

  <rect x="84" y="752" width="360" height="126" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="120" cy="790" r="12" fill="#059669"/><path d="M114 790l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="797" class="outTitle">expose</text><text x="148" y="824" class="outSub">直接曝光 · 低风险候选</text>
  <rect x="498" y="752" width="360" height="126" rx="16" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="534" cy="790" r="12" fill="#d97706"/><path d="M529 795l9-9m-11 11 3-1 8-8-3-3-8 8Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><text x="562" y="797" class="outTitle">rewrite</text><text x="562" y="824" class="outSub">改写后曝光 · 可修复表达</text>
  <rect x="912" y="752" width="360" height="126" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <circle cx="948" cy="790" r="12" fill="#ea580c"/><circle cx="948" cy="786" r="3" fill="#fff"/><path d="M942 797c2-5 10-5 12 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="976" y="797" class="outTitle">human_review</text><text x="976" y="824" class="outSub">人工合规队列 · 模糊场景</text>
  <rect x="1326" y="752" width="366" height="126" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="1.5"/>
  <circle cx="1362" cy="790" r="12" fill="#be123c"/><path d="M1356 790h12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="1390" y="797" class="outTitle">block</text><text x="1390" y="824" class="outSub">禁止曝光 · 硬风险命中</text>
  <text x="900" y="950" text-anchor="middle" class="small">图 1 · Rec-Agent 负责生成，Jev 负责审核；所有箭头表示真实数据或判决流向</text>
</svg>
