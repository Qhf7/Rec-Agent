name: Publish interactive demo

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_pages.py'
      - 'scripts/strict_json_output.py'
      - 'canonical_data.py'
      - 'data/raw/users.csv'
      - 'data/raw/items.csv'
      - 'tests/static-api.test.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser demo contract
        run: node --test tests/static-api.test.js
      - name: Build public site
        run: python3 scripts/build_pages.py --output runs/github-pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: runs/github-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
